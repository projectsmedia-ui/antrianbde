function chime(){
  try{
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    [[880,0],[660,0.55]].forEach(([f,t])=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0,ac.currentTime+t); g.gain.linearRampToValueAtTime(0.4,ac.currentTime+t+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+t+1.2);
      o.start(ac.currentTime+t); o.stop(ac.currentTime+t+1.25);
    });
  }catch(e){}
}
function announce(code,num,loket){
  chime();
  const digits = pad(num).split("").map(d=>DIG[+d]).join(" ");
  const text = `Nomor antrian ${code} ${digits}, silakan menuju ke ${loket.replace(/(\d+)$/,(m)=>" "+DIG[+m])}`;
  setTimeout(()=>{
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang="id-ID"; u.rate=0.9;
      const v = speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("id"));
      if(v) u.voice=v;
      speechSynthesis.speak(u);
    }catch(e){}
  },1300);
}

function App(){
  const [role,setRole] = useState("satpam");
  const [now,setNow] = useState(new Date());
  const [cfg,setCfg] = useState(()=>({...CFG0,...(S0.cfg||{})}));
  const [lokets,setLokets] = useState(ini("lokets",[{id:"t1",name:"Teller 1",cat:"B",on:true},{id:"t2",name:"Teller 2",cat:"B",on:true},{id:"c1",name:"CS 1",cat:"A",on:true},{id:"c2",name:"CS 2",cat:"A",on:true}]));
  const [tix,setTix] = useState(ini("tix",[]));
  const [cnt,setCnt] = useState(ini("cnt",{A:0,B:0}));
  const [cur,setCur] = useState(ini("cur",{}));
  const [hist,setHist] = useState(ini("hist",[]));
  const [last,setLast] = useState(ini("last",null));
  const [modal,setModal] = useState(null);
  const [toast,setToast] = useState("");
  const [sel,setSel] = useState({B:"t1",A:"c1"});
  const [manual,setManual] = useState("");
  const [nl,setNl] = useState({name:"",cat:"B"});
  const [users,setUsers] = useState(()=>{const u=ini("users",[{id:1,name:"Administrator",u:"admin",p:"admin123",role:"admin"},{id:2,name:"Petugas Satpam",u:"satpam",p:"satpam123",role:"satpam"},{id:3,name:"Petugas Teller",u:"teller",p:"teller123",role:"teller"},{id:4,name:"Petugas CS",u:"cs",p:"cs123",role:"cs"}]);return u.some(x=>x.role==="operator")?u:[...u,{id:5,name:"Operator TV",u:"operator",p:"operator123",role:"operator"}]});
  const [meId,setMeId] = useState(()=>{try{return +sessionStorage.getItem("bpr_me")||0}catch(e){return 0}});
  const [pageS,setPage] = useState("");
  const [open,setOpen] = useState(false);
  const [lg,setLg] = useState({u:"",p:"",err:""});
  const [tvIn,setTvIn] = useState("");
  const [tvKey,setTvKey] = useState(()=>location.hash.startsWith("#/tv/")?location.hash.slice(5):"");
  const [nu,setNu] = useState({name:"",u:"",p:"",role:"teller"});
  useEffect(()=>{try{localStorage.setItem("bpr_state",JSON.stringify({cfg,lokets,tix,cnt,cur,hist,last,users}))}catch(e){}},[cfg,lokets,tix,cnt,cur,hist,last,users]);
  useEffect(()=>{
    const st=e=>{if(e.key!=="bpr_state"||!e.newValue)return;try{const x=JSON.parse(e.newValue);setCfg(x.cfg);setLokets(x.lokets);setTix(x.tix);setCnt(x.cnt);setCur(x.cur);setHist(x.hist);setLast(x.last);setUsers(x.users)}catch(er){}};
    const hc=()=>setTvKey(location.hash.startsWith("#/tv/")?location.hash.slice(5):"");
    window.addEventListener("storage",st);window.addEventListener("hashchange",hc);
    return()=>{window.removeEventListener("storage",st);window.removeEventListener("hashchange",hc)};
  },[]);

  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t)},[]);
  useEffect(()=>{if(toast){const t=setTimeout(()=>setToast(""),2500);return()=>clearTimeout(t)}},[toast]);

  const label = t => `${t.code}-${pad(t.num)}`;
  const waiting = cat => tix.filter(t=>t.cat===cat && t.status==="waiting");
  const setCfgK = (k,v)=>setCfg(c=>({...c,[k]:v}));

  const take = cat => {
    if(!cfg.queueOn) return setToast("Sistem antrian sedang OFF");
    const num = cnt[cat]+1;
    const t = {id:Date.now()+cat, code:cat, num, cat, status:"waiting", at:new Date(), est:waiting(cat).length};
    setCnt({...cnt,[cat]:num}); setTix([...tix,t]); setModal(t);
  };
  const finishCur = (lid, list) => {
    const id = cur[lid];
    return id ? list.map(t=>t.id===id?{...t,status:"done"}:t) : list;
  };
  const doCall = (lk, t, base) => {
    const list = finishCur(lk.id, base).map(x=>x.id===t.id?{...x,status:"called"}:x);
    setTix(list); setCur({...cur,[lk.id]:t.id});
    const entry = {label:label(t),loket:lk.name,k:Date.now()};
    setHist([entry,...hist].slice(0,8)); setLast(entry);
    announce(t.code,t.num,lk.name);
  };
  const next = lk => {
    if(!cfg.queueOn) return setToast("Sistem antrian sedang OFF");
    const t = waiting(lk.cat)[0];
    if(!t) return setToast("Tidak ada antrian menunggu");
    doCall(lk,t,tix);
  };
  const recall = lk => {
    const t = tix.find(x=>x.id===cur[lk.id]);
    if(!t) return setToast("Belum ada nasabah aktif");
    const entry = {label:label(t),loket:lk.name,k:Date.now()}; setLast(entry);
    announce(t.code,t.num,lk.name);
  };
  const finish = lk => {
    if(!cur[lk.id]) return setToast("Tidak ada nasabah aktif");
    setTix(finishCur(lk.id,tix)); const c={...cur}; delete c[lk.id]; setCur(c); setToast("Transaksi selesai");
  };
  const callManual = lk => {
    if(!cfg.queueOn) return setToast("Sistem antrian sedang OFF");
    const n = parseInt(manual.replace(/\D/g,""),10);
    const t = tix.find(x=>x.cat===lk.cat && x.num===n && x.status==="waiting");
    if(!t) return setToast("Nomor tidak ditemukan / bukan status menunggu");
    doCall(lk,t,tix); setManual("");
  };
  const reset = () => { setTix([]); setCnt({A:0,B:0}); setCur({}); setHist([]); setLast(null); setToast("Antrian direset: A-000 dan B-000"); };

  const th = THEMES[cfg.theme];
  const menus = {admin:[["dash","Dashboard","hash"],["tv","TV Display","tv"],["loket","Loket","users"],["rate","Suku bunga","percent"],["users","Akun pengguna","lock"]],operator:[["tv","Kontrol TV","tv"],["antrian","On/Off antrian","power"]],satpam:[["ambil","Ambil antrian","shield"],["daftar","Daftar antrian","users"]],teller:[["panel","Panel loket","wallet"],["daftar","Daftar antrian","users"]],cs:[["panel","Panel loket","headset"],["daftar","Daftar antrian","users"]]};
  const me = users.find(x=>x.id===meId);
  const page = pageS || (me?menus[me.role][0][0]:"");
  const tvOk = tvKey && tvKey===cfg.token;
  const doLogin = () => {const f=users.find(x=>x.u===lg.u.trim()&&x.p===lg.p);if(!f)return setLg({...lg,err:"Username atau kata sandi salah"});try{sessionStorage.setItem("bpr_me",String(f.id))}catch(e){}setMeId(f.id);setPage("");setLg({u:"",p:"",err:""})};
  const logout = () => {try{sessionStorage.removeItem("bpr_me")}catch(e){}setMeId(0);setPage("");setOpen(false)};
  const inp = "w-full border rounded-xl px-3 py-3 text-base";
  const Login = () => (
    <div className="min-h-screen flex items-center justify-center p-4" style={{background:"#0f4c2a"}}>
      <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-7" style={{borderTop:"6px solid #86d04a"}}>
        <img src={LOGO} alt="Logo PT BPR Dhaha Ekonomi" className="w-full h-auto mb-2"/><div className="text-center text-slate-500 mb-5">Sistem Antrian Digital, silakan masuk</div>
        <div className="grid gap-3" onKeyDown={e=>{if(e.key==="Enter")doLogin()}}>
          <input className={inp} placeholder="Username" autoComplete="username" value={lg.u} onChange={e=>setLg({...lg,u:e.target.value,err:""})}/>
          <input className={inp} type="password" placeholder="Kata sandi" autoComplete="current-password" value={lg.p} onChange={e=>setLg({...lg,p:e.target.value,err:""})}/>
          {lg.err && <div className="text-red-600 text-sm">{lg.err}</div>}
          <button onClick={doLogin} className="bg-[#0f4c2a] text-white rounded-xl py-3 font-bold">Masuk</button>
        </div>
        <div className="border-t mt-5 pt-4">
          <div className="text-sm text-slate-500 mb-2">Layar TV tidak perlu login. Masukkan kode TV dari menu Admin.</div>
          <div className="flex gap-2"><input className="flex-1 min-w-0 border rounded-xl px-3 py-2" placeholder="Kode TV" value={tvIn} onChange={e=>setTvIn(e.target.value)}/><button onClick={()=>tvIn.trim()===cfg.token?setTvKey(tvIn.trim()):setLg({...lg,err:"Kode TV tidak valid"})} className="bg-[#86d04a] text-[#0f4c2a] rounded-xl px-4 font-bold">Buka TV</button></div>
        </div>
        <div className="text-xs text-slate-400 mt-4">Akun awal: admin / admin123, satpam / satpam123, teller / teller123, cs / cs123, operator / operator123. Ganti di menu Admin.</div>
      </div>
    </div>);
  const stLbl = {waiting:"Menunggu",called:"Dipanggil",done:"Selesai"};
  const Daftar = cat => (
    <div className="max-w-4xl mx-auto p-4 md:p-8"><div className="bg-white rounded-2xl shadow overflow-x-auto">
      <table className="w-full text-left"><thead className="bg-slate-50 text-slate-500 text-sm"><tr><th className="p-3">Nomor</th><th className="p-3">Layanan</th><th className="p-3">Waktu ambil</th><th className="p-3">Status</th></tr></thead>
      <tbody>{tix.filter(t=>!cat||t.cat===cat).slice().reverse().map(t=>(<tr key={t.id} className="border-t"><td className="p-3 font-black text-[#0f4c2a]">{label(t)}</td><td className="p-3">{t.cat==="B"?"Teller":"Customer Service"}</td><td className="p-3">{new Date(t.at).toLocaleTimeString("id-ID",{hour12:false})}</td><td className="p-3 font-semibold">{stLbl[t.status]}</td></tr>))}</tbody></table>
      {!tix.filter(t=>!cat||t.cat===cat).length && <div className="p-6 text-center text-slate-400">Belum ada antrian hari ini</div>}
    </div></div>);
  const roles = [["tv","TV Display","tv"],["satpam","Satpam","shield"],["teller","Teller","wallet"],["cs","CS","headset"],["admin","Admin","cog"]];
  const dateStr = now.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const timeStr = now.toLocaleTimeString("id-ID",{hour12:false});

  /* ---------- TV ---------- */
  const TV = () => {
    const id = ytId(cfg.yt);
    const src = id ? `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&rel=0${cfg.loop?`&loop=1&playlist=${id}`:""}` : "";
    const active = lokets.filter(l=>l.on);
    const fs = cfg.font;
    const Video = (
      <div className="rounded-2xl overflow-hidden bg-black relative w-full" style={{aspectRatio:"16/9"}}>
        {cfg.playing && src ? <iframe title="video" src={src} className="absolute inset-0 w-full h-full" allow="autoplay; encrypted-media; picture-in-picture" referrerPolicy="strict-origin-when-cross-origin" allowFullScreen /> :
          <div className="absolute inset-0 flex flex-col items-center justify-center text-white/70 gap-2"><Ic n="pause" s={48}/><span>{src?"Video dijeda":"URL YouTube tidak valid"}</span></div>}
      </div>);
    const Now = (
      <div className="flex flex-col gap-3 min-h-0">
        <div key={last?last.k:"x"} className={`rounded-2xl p-4 text-center ${last?"glow":""}`} style={{background:th.panel,border:`3px solid ${th.ac}`}}>
          <div className="opacity-80" style={{fontSize:`${1.1*fs}rem`}}>Nomor Dipanggil</div>
          <div className="font-black tracking-wider" style={{color:th.ac,fontSize:`${4.5*fs}rem`,lineHeight:1.1}}>{last?last.label:"---"}</div>
          <div className="font-semibold" style={{fontSize:`${1.6*fs}rem`}}>{last?`Menuju ${last.loket}`:"Menunggu panggilan"}</div>
        </div>
        <div className="grid grid-cols-2 gap-2">
          {active.map(l=>{const t=tix.find(x=>x.id===cur[l.id]);return(
            <div key={l.id} className="rounded-xl p-2 flex items-center justify-between" style={{background:th.panel}}>
              <span className="font-semibold" style={{fontSize:`${1*fs}rem`}}>{l.name}</span>
              <span className="font-black" style={{color:th.ac,fontSize:`${1.6*fs}rem`}}>{t?label(t):"—"}</span>
            </div>)})}
        </div>
        <div className="rounded-xl p-3" style={{background:th.panel}}>
          <div className="font-semibold mb-1 opacity-80" style={{fontSize:`${0.95*fs}rem`}}>Riwayat panggilan</div>
          {hist.length===0 && <div className="opacity-60 text-sm">Belum ada panggilan</div>}
          {hist.slice(0,5).map((h,i)=>(<div key={h.k} className="flex justify-between py-0.5" style={{opacity:1-i*0.12,fontSize:`${1.1*fs}rem`}}><b>{h.label}</b><span>{h.loket}</span></div>))}
        </div>
      </div>);
    const pill = {background:"#1b6b3a",fontSize:`${1.2*fs}rem`};
    const cell = {background:"#fdf0c8",color:"#0f5a2a"};
    const Rate = (
      <div className="rounded-2xl p-4 flex flex-col gap-3" style={{background:th.panel}}>
        <div className="text-center font-black" style={{fontSize:`${1.7*fs}rem`,color:th.ac}}>{cfg.rateTitle}</div>
        <div className="grid grid-cols-2 gap-3">
          <div className="rounded-full py-2 px-4 flex items-center justify-center gap-2 font-bold text-white" style={pill}><Ic n="calendar" s={22}/>Jangka Waktu</div>
          <div className="rounded-full py-2 px-4 flex items-center justify-center gap-2 font-bold text-white" style={pill}><Ic n="percent" s={22}/>Suku Bunga (*)</div>
        </div>
        {cfg.rates.map((x,i)=>(<div key={i} className="grid grid-cols-2 gap-3">
          <div className="rounded-full py-3 text-center font-black" style={{...cell,fontSize:`${1.8*fs}rem`}}>{x.t}</div>
          <div className="rounded-full py-3 text-center font-black" style={{...cell,fontSize:`${1.8*fs}rem`}}>{x.r} <span style={{fontSize:"0.55em"}}>% p.a</span></div>
        </div>))}
        <div className="text-right opacity-80" style={{fontSize:`${0.9*fs}rem`}}>{cfg.rateNote}</div>
      </div>);
    return (
      <div className="min-h-screen flex flex-col" style={{background:th.bg,color:th.tx,"--ac":th.ac+"aa"}}>
        <div className="flex items-center justify-between px-5 py-3 flex-wrap gap-2" style={{borderBottom:`3px solid ${th.ac}`}}>
          <div className="flex items-center gap-3">
            <div className="bg-white rounded-xl px-3 py-1.5"><img src={LOGO} alt="Logo PT BPR Dhaha Ekonomi" className="h-10 md:h-14 w-auto"/></div>
            <div><div className="font-extrabold text-xl md:text-2xl">{cfg.header}</div></div>
          </div>
          <div className="text-right"><div className="font-black text-3xl md:text-4xl tabular-nums" style={{color:th.ac}}>{timeStr}</div><div className="text-sm opacity-80">{dateStr}</div></div>
        </div>
        <div className={`flex-1 p-4 grid gap-4 items-start ${cfg.layout==="A"?"lg:grid-cols-[3fr_2fr]":"lg:grid-cols-[2fr_3fr]"}`}>
          {(()=>{const Side=cfg.queueOn?Now:Rate;return cfg.layout==="A"?<>{Video}{Side}</>:<>{Side}{Video}</>})()}
        </div>
        <div className="overflow-hidden py-2 font-semibold" style={{background:th.ac,color:cfg.theme==="light"?"#fff":"#0f4c2a",fontSize:`${1.2*fs}rem`}}><span className="marq">{cfg.marquee}</span></div>
      </div>);
  };

  /* ---------- Satpam ---------- */
  const Satpam = () => (
    <div className="max-w-3xl mx-auto p-4 md:p-8">
      <div className="text-center mb-6"><div className="text-2xl md:text-3xl font-extrabold text-[#0f4c2a]">Selamat datang di PT BPR Dhaha Ekonomi</div><div className="text-slate-500 mt-1">Pilih layanan untuk mengambil nomor antrian</div></div>
      {!cfg.queueOn && <div className="mb-4 rounded-2xl bg-red-50 text-red-700 p-4 text-center font-semibold">Sistem antrian sedang OFF. Pengambilan nomor dinonaktifkan.</div>}
      <div className="grid gap-4 md:grid-cols-2">
        {[["B","AMBIL ANTRIAN TELLER","Pembayaran, penarikan, setoran","wallet","bg-[#0f4c2a] text-white"],["A","AMBIL ANTRIAN CUSTOMER SERVICE","Buka rekening, kredit, informasi","headset","bg-[#0b6cf0] text-white"]].map(([c,t,d,i,cls])=>(
          <button key={c} disabled={!cfg.queueOn} onClick={()=>take(c)} className={`${cls} ${cfg.queueOn?"":"opacity-40"} rounded-3xl p-8 shadow-lg active:scale-95 transition-transform flex flex-col items-center gap-3 min-h-[240px] justify-center`}>
            <Ic n={i} s={64}/><span className="text-2xl font-black text-center">{t}</span><span className="opacity-80 text-center">{d}</span>
            <span className="text-sm font-semibold bg-white/20 rounded-full px-3 py-1">{waiting(c).length} menunggu</span>
          </button>))}
      </div>
    </div>);

  /* ---------- Petugas ---------- */
  const Petugas = ({cat}) => {
    const opts = lokets.filter(l=>l.cat===cat && l.on);
    const lk = opts.find(l=>l.id===sel[cat]) || opts[0];
    if(!lk) return <div className="p-8 text-center text-slate-500">Belum ada loket aktif untuk layanan ini. Aktifkan di menu Admin.</div>;
    const t = tix.find(x=>x.id===cur[lk.id]);
    const w = waiting(cat);
    const Btn = ({onClick,icon,txt,cls}) => <button onClick={onClick} className={`${cls} rounded-2xl p-4 font-bold flex items-center justify-center gap-2 shadow active:scale-95 transition-transform`}><Ic n={icon} s={22}/>{txt}</button>;
    return (
      <div className="max-w-5xl mx-auto p-4 md:p-8 grid gap-4 md:grid-cols-2">
        {!cfg.queueOn && <div className="md:col-span-2 rounded-2xl bg-red-50 text-red-700 p-3 text-center font-semibold">Sistem antrian OFF. Panggilan baru dinonaktifkan.</div>}
        <div className="bg-white rounded-2xl shadow p-6 md:col-span-2 flex flex-wrap items-center justify-between gap-3">
          <div><div className="text-slate-500 text-sm">Loket aktif</div><div className="text-3xl font-black text-[#0f4c2a]">{lk.name}</div></div>
          <select value={lk.id} onChange={e=>setSel({...sel,[cat]:e.target.value})} className="border rounded-xl px-3 py-2">{opts.map(o=><option key={o.id} value={o.id}>{o.name}</option>)}</select>
          <div className="flex items-center gap-2 text-[#0f4c2a]"><Ic n="users"/><b className="text-2xl">{w.length}</b><span className="text-slate-500">menunggu</span></div>
        </div>
        <div className="bg-[#0f4c2a] text-white rounded-2xl shadow p-8 text-center flex flex-col justify-center">
          <div className="opacity-70">Sedang dilayani</div>
          <div className="text-7xl font-black my-2" style={{color:"#86d04a"}}>{t?label(t):"---"}</div>
          <div className="opacity-70">{t?"Nasabah aktif":"Belum ada nasabah"}</div>
        </div>
        <div className="bg-white rounded-2xl shadow p-6 grid gap-3">
          <Btn onClick={()=>next(lk)} icon="vol" txt="Panggil Selanjutnya" cls="bg-[#0f4c2a] text-white"/>
          <Btn onClick={()=>recall(lk)} icon="redo" txt="Panggil Ulang" cls="bg-[#86d04a] text-[#0f4c2a]"/>
          <Btn onClick={()=>finish(lk)} icon="check" txt="Selesai Melayani" cls="bg-emerald-600 text-white"/>
          <div className="flex gap-2">
            <input value={manual} onChange={e=>setManual(e.target.value)} placeholder={`Nomor spesifik, mis. ${cat}-003`} className="flex-1 border rounded-xl px-3 py-2"/>
            <button onClick={()=>callManual(lk)} className="bg-slate-800 text-white rounded-xl px-4 font-semibold">Panggil</button>
          </div>
        </div>
        <div className="bg-white rounded-2xl shadow p-4 md:col-span-2">
          <div className="font-semibold mb-2 text-[#0f4c2a]">Daftar menunggu</div>
          <div className="flex flex-wrap gap-2">{w.length?w.map(x=><span key={x.id} className="px-3 py-1 rounded-full bg-slate-100 font-bold text-[#0f4c2a]">{label(x)}</span>):<span className="text-slate-400">Tidak ada antrian</span>}</div>
        </div>
      </div>);
  };

  /* ---------- Admin ---------- */
  const Admin = () => {
    const total=tix.length, done=tix.filter(t=>t.status==="done").length, wt=tix.filter(t=>t.status==="waiting").length;
    const setRate = (i,k,v)=>setCfgK("rates",cfg.rates.map((x,j)=>j===i?{...x,[k]:v}:x));
    const QueueCard = <Card t="Status sistem antrian">
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div><div className={`text-3xl font-black ${cfg.queueOn?"text-green-700":"text-red-600"}`}>{cfg.queueOn?"ON":"OFF"}</div>
          <div className="text-sm text-slate-500">{cfg.queueOn?"Antrian berjalan. TV menampilkan nomor panggilan.":"Antrian berhenti. TV menampilkan tabel suku bunga deposito."}</div></div>
        <button onClick={()=>{setCfgK("queueOn",!cfg.queueOn);setToast(cfg.queueOn?"Antrian dimatikan":"Antrian dinyalakan")}} className={`flex items-center gap-2 rounded-xl px-5 py-3 font-bold text-white ${cfg.queueOn?"bg-red-600":"bg-green-700"}`}><Ic n="power" s={20}/>{cfg.queueOn?"Matikan antrian":"Nyalakan antrian"}</button>
      </div></Card>;
    const RateCard = <Card t="Tabel suku bunga deposito (tampil di TV saat antrian OFF)">
      <label className="text-sm text-slate-500">Judul tabel</label>
      <input value={cfg.rateTitle} onChange={e=>setCfgK("rateTitle",e.target.value)} className="w-full border rounded-xl px-3 py-2 mb-3"/>
      {cfg.rates.map((x,i)=>(<div key={i} className="flex gap-2 mb-2">
        <input value={x.t} placeholder="Jangka waktu" onChange={e=>setRate(i,"t",e.target.value)} className="flex-1 min-w-0 border rounded-xl px-3 py-2"/>
        <input value={x.r} placeholder="5.00" onChange={e=>setRate(i,"r",e.target.value)} className="w-24 border rounded-xl px-3 py-2"/>
        <button aria-label="Hapus baris" onClick={()=>setCfgK("rates",cfg.rates.filter((_,j)=>j!==i))} className="p-2 text-red-600"><Ic n="trash" s={18}/></button></div>))}
      <button onClick={()=>setCfgK("rates",[...cfg.rates,{t:"",r:""}])} className="border rounded-xl px-4 py-2 font-semibold mb-3">Tambah baris</button>
      <label className="text-sm text-slate-500 block">Catatan kaki</label>
      <input value={cfg.rateNote} onChange={e=>setCfgK("rateNote",e.target.value)} className="w-full border rounded-xl px-3 py-2"/></Card>;
    const tvLink = location.href.split("#")[0]+"#/tv/"+cfg.token;
    const LinkCard = <Card t="Link TV Display">
      <p className="text-sm text-slate-500 mb-2">Buka link ini di browser Android TV. Layar TV tidak memerlukan login.</p>
      <input readOnly value={tvLink} onFocus={e=>e.target.select()} className="w-full border rounded-xl px-3 py-2 mb-2 text-sm bg-slate-50"/>
      <div className="text-sm mb-3">Kode TV: <b>{cfg.token}</b></div>
      <div className="flex gap-2 flex-wrap">
        <button onClick={()=>{try{navigator.clipboard.writeText(tvLink).then(()=>setToast("Link disalin")).catch(()=>setToast("Salin manual dari kolom"))}catch(e){setToast("Salin manual dari kolom")}}} className="bg-[#0f4c2a] text-white rounded-xl px-4 py-2 font-semibold">Salin link</button>
        <button onClick={()=>window.open(tvLink,"_blank")} className="bg-[#86d04a] text-[#0f4c2a] rounded-xl px-4 py-2 font-semibold">Buka TV</button>
        <button onClick={()=>{setCfgK("token","tv"+Math.random().toString(36).slice(2,8));setToast("Link lama tidak berlaku lagi")}} className="border rounded-xl px-4 py-2 font-semibold">Buat link baru</button>
      </div></Card>;
    const addUser = () => {
      if(!nu.name.trim()||!nu.u.trim()||!nu.p) return setToast("Lengkapi nama, username, dan kata sandi");
      if(users.some(x=>x.u===nu.u.trim())) return setToast("Username sudah dipakai");
      setUsers([...users,{id:Date.now(),name:nu.name.trim(),u:nu.u.trim(),p:nu.p,role:nu.role}]); setNu({...nu,name:"",u:"",p:""});
    };
    const UsersCard = <Card t="Akun pengguna">
      <div className="grid gap-2 mb-4">{users.map(x=>(
        <div key={x.id} className="flex items-center justify-between border rounded-xl px-3 py-2"><div><b>{x.name}</b><div className="text-xs text-slate-500">{x.u} ({x.role})</div></div>
          {x.id!==me.id && <button aria-label="Hapus akun" onClick={()=>setUsers(users.filter(y=>y.id!==x.id))} className="p-1 text-red-600"><Ic n="trash" s={18}/></button>}</div>))}</div>
      <div className="grid gap-2 sm:grid-cols-2">
        <input className="border rounded-xl px-3 py-2" placeholder="Nama" value={nu.name} onChange={e=>setNu({...nu,name:e.target.value})}/>
        <input className="border rounded-xl px-3 py-2" placeholder="Username" value={nu.u} onChange={e=>setNu({...nu,u:e.target.value})}/>
        <input className="border rounded-xl px-3 py-2" placeholder="Kata sandi" value={nu.p} onChange={e=>setNu({...nu,p:e.target.value})}/>
        <select className="border rounded-xl px-2 py-2" value={nu.role} onChange={e=>setNu({...nu,role:e.target.value})}><option value="admin">Admin</option><option value="satpam">Satpam</option><option value="teller">Teller</option><option value="cs">CS</option><option value="operator">Operator TV</option></select>
      </div>
      <button onClick={addUser} className="mt-3 bg-[#0f4c2a] text-white rounded-xl px-4 py-2 font-semibold">Tambah akun</button></Card>;
    return (
      <div className="max-w-6xl mx-auto p-4 md:p-8 grid gap-4 md:grid-cols-3">
        {(page==="dash"||page==="antrian") && <div className="md:col-span-3">{QueueCard}</div>}
        {page==="dash" && [["Total antrian hari ini",total,"hash"],["Terlayani",done,"check"],["Menunggu",wt,"clock"]].map(([l,v,i])=>(
          <div key={l} className="bg-white rounded-2xl shadow p-5 flex items-center gap-4"><div className="w-12 h-12 rounded-xl bg-[#0f4c2a] text-[#86d04a] flex items-center justify-center"><Ic n={i}/></div><div><div className="text-3xl font-black text-[#0f4c2a]">{v}</div><div className="text-slate-500 text-sm">{l}</div></div></div>))}
        {page==="tv" && <div className="md:col-span-3 grid gap-4 md:grid-cols-2">
          <Card t="Kontrol TV Display">
            <label className="text-sm text-slate-500">URL YouTube</label>
            <input value={cfg.yt} onChange={e=>setCfgK("yt",e.target.value)} className="w-full border rounded-xl px-3 py-2 mb-1"/>
            <div className="text-xs mb-3">{ytId(cfg.yt) ? <span className="text-green-700">ID video terdeteksi: {ytId(cfg.yt)}. <a className="underline" href={"https://www.youtube.com/watch?v="+ytId(cfg.yt)} target="_blank" rel="noreferrer">Tes buka di YouTube</a></span> : <span className="text-red-600">URL YouTube tidak dikenali</span>}</div>
            <div className="flex gap-2 mb-3 flex-wrap">
              <Chip on={cfg.playing} onClick={()=>setCfgK("playing",true)}>Play</Chip>
              <Chip on={!cfg.playing} onClick={()=>setCfgK("playing",false)}>Pause</Chip>
              <Chip on={cfg.loop} onClick={()=>setCfgK("loop",!cfg.loop)}>Loop {cfg.loop?"aktif":"mati"}</Chip>
            </div>
            <label className="text-sm text-slate-500">Teks header</label>
            <input value={cfg.header} onChange={e=>setCfgK("header",e.target.value)} className="w-full border rounded-xl px-3 py-2 mb-3"/>
            <label className="text-sm text-slate-500">Running text</label>
            <textarea value={cfg.marquee} onChange={e=>setCfgK("marquee",e.target.value)} rows={2} className="w-full border rounded-xl px-3 py-2"/>
          </Card>
          <Card t="Desain TV (realtime)">
            <div className="text-sm text-slate-500 mb-1">Tema warna</div>
            <div className="flex gap-2 flex-wrap mb-3">{Object.entries(THEMES).map(([k,v])=><Chip key={k} on={cfg.theme===k} onClick={()=>setCfgK("theme",k)}>{v.name}</Chip>)}</div>
            <div className="text-sm text-slate-500 mb-1">Tata letak</div>
            <div className="flex gap-2 mb-3"><Chip on={cfg.layout==="A"} onClick={()=>setCfgK("layout","A")}>Layout A (video kiri)</Chip><Chip on={cfg.layout==="B"} onClick={()=>setCfgK("layout","B")}>Layout B (antrian kiri)</Chip></div>
            <div className="text-sm text-slate-500 mb-1">Ukuran teks</div>
            <div className="flex gap-2">{[[0.8,"Kecil"],[1,"Normal"],[1.25,"Besar"]].map(([v,n])=><Chip key={v} on={cfg.font===v} onClick={()=>setCfgK("font",v)}>{n}</Chip>)}</div>
          </Card>
          {me.role==="admin" && LinkCard}
        </div>}
        <div className="md:col-span-3 grid gap-4 md:grid-cols-2 content-start">
          {page==="loket" && <Card t="Loket & petugas">
            <div className="grid gap-2 mb-3">{lokets.map(l=>(
              <div key={l.id} className="flex items-center justify-between border rounded-xl px-3 py-2">
                <div><b>{l.name}</b><span className="text-xs text-slate-500 ml-2">{l.cat==="B"?"Teller":"CS"}</span></div>
                <div className="flex gap-1">
                  <button onClick={()=>setLokets(lokets.map(x=>x.id===l.id?{...x,on:!x.on}:x))} className={`px-2 py-1 rounded-lg text-xs font-bold ${l.on?"bg-emerald-100 text-emerald-700":"bg-slate-200 text-slate-600"}`}>{l.on?"Aktif":"Nonaktif"}</button>
                  <button aria-label="Hapus" onClick={()=>setLokets(lokets.filter(x=>x.id!==l.id))} className="p-1 text-red-600"><Ic n="trash" s={18}/></button>
                </div></div>))}</div>
            <div className="flex gap-2">
              <input value={nl.name} onChange={e=>setNl({...nl,name:e.target.value})} placeholder="Nama loket" className="flex-1 min-w-0 border rounded-xl px-3 py-2"/>
              <select value={nl.cat} onChange={e=>setNl({...nl,cat:e.target.value})} className="border rounded-xl px-2"><option value="B">Teller</option><option value="A">CS</option></select>
              <button aria-label="Tambah loket" onClick={()=>{if(nl.name.trim()){setLokets([...lokets,{id:"l"+Date.now(),name:nl.name.trim(),cat:nl.cat,on:true}]);setNl({...nl,name:""})}}} className="bg-[#0f4c2a] text-white rounded-xl px-3"><Ic n="plus"/></button>
            </div>
          </Card>}
          {page==="dash" && <Card t="Reset harian">
            <button onClick={reset} className="w-full bg-red-600 text-white rounded-xl py-3 font-bold">Reset antrian (A-000 & B-000)</button>
          </Card>}
          {page==="users" && UsersCard}
          {page==="rate" && RateCard}
        </div>
      </div>);
  };

  if(tvKey) return tvOk ? TV() : <div className="min-h-screen flex flex-col items-center justify-center gap-3 bg-[#0f4c2a] text-white p-6 text-center"><div className="text-2xl font-bold">Link TV tidak valid atau sudah diganti</div><button onClick={()=>{location.hash="";setTvKey("")}} className="bg-[#86d04a] text-[#0f4c2a] rounded-xl px-5 py-2 font-bold">Ke halaman login</button></div>;
  if(!me) return Login();
  const mn = menus[me.role];
  const cat = me.role==="teller"?"B":me.role==="cs"?"A":null;
  return (
    <div className="min-h-screen md:flex">
      <div className="md:hidden sticky top-0 z-30 h-14 bg-[#0f4c2a] text-white flex items-center px-3 gap-3" style={{borderBottom:"3px solid #86d04a"}}>
        <button aria-label="Buka menu" onClick={()=>setOpen(true)} className="p-1"><Ic n="menu"/></button><span className="bg-white rounded-lg px-2 py-1"><img src={LOGO} alt="Logo" className="h-7 w-auto"/></span>
      </div>
      {open && <div className="fixed inset-0 z-40 bg-black/50 md:hidden" onClick={()=>setOpen(false)}/>}
      <aside className={`fixed md:sticky top-0 z-50 h-screen w-64 shrink-0 bg-[#0f4c2a] text-white flex flex-col transition-transform ${open?"translate-x-0":"-translate-x-full"} md:translate-x-0`} style={{borderRight:"3px solid #86d04a"}}>
        <div className="p-4"><div className="bg-white rounded-xl p-2"><img src={LOGO} alt="Logo PT BPR Dhaha Ekonomi" className="w-full h-auto"/></div></div>
        <div className="px-5 pb-4 text-sm text-white/70">Masuk sebagai<div className="font-semibold text-white">{me.name}</div></div>
        <nav className="flex-1 px-3 grid content-start gap-1">{mn.map(([k,n,i])=>(
          <button key={k} onClick={()=>{setPage(k);setOpen(false)}} className={`flex items-center gap-3 px-3 py-2.5 rounded-lg font-semibold text-left ${page===k?"bg-[#86d04a] text-[#0f4c2a]":"hover:bg-white/10"}`}><Ic n={i} s={18}/>{n}</button>))}</nav>
        <button onClick={logout} className="m-3 flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 font-semibold"><Ic n="out" s={18}/>Keluar</button>
      </aside>
      <main className="flex-1 min-w-0">
        {me.role==="satpam" && page==="ambil" && Satpam()}
        {cat && page==="panel" && Petugas({cat})}
        {page==="daftar" && Daftar(cat)}
        {(me.role==="admin"||me.role==="operator") && Admin()}
      </main>

      {modal && (
        <div className="fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-4" onClick={()=>setModal(null)}>
          <div className="bg-white rounded-2xl w-full max-w-sm p-6 text-center shadow-2xl" onClick={e=>e.stopPropagation()}>
            <img src={LOGO} alt="PT BPR Dhaha Ekonomi" className="w-52 mx-auto mb-1"/>
            <div className="text-slate-500 text-sm border-b border-dashed pb-3 mb-3">{modal.cat==="B"?"Layanan Teller":"Layanan Customer Service"}</div>
            <div className="text-slate-500 text-sm">Nomor antrian Anda</div>
            <div className="text-6xl font-black text-[#0f4c2a] my-2">{label(modal)}</div>
            <div className="text-sm text-slate-600">{modal.at.toLocaleDateString("id-ID")} {modal.at.toLocaleTimeString("id-ID",{hour12:false})}</div>
            <div className="mt-3 bg-green-50 rounded-xl py-2 text-[#0f4c2a]">Antrian di depan Anda: <b>{modal.est}</b> (± {modal.est*3} menit)</div>
            <div className="flex gap-2 mt-5">
              <button onClick={()=>{setToast("Tiket dicetak (simulasi)");setModal(null)}} className="flex-1 bg-[#0f4c2a] text-white rounded-xl py-3 font-bold flex items-center justify-center gap-2"><Ic n="print" s={18}/>Cetak Tiket</button>
              <button onClick={()=>setModal(null)} className="px-4 rounded-xl border font-semibold">Tutup</button>
            </div>
          </div>
        </div>)}
      {toast && <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[70] bg-slate-900 text-white px-5 py-3 rounded-xl shadow-lg">{toast}</div>}
    </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
